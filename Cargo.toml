[package]
name = "cols-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "Standalone native-client launcher and TCP routing prototype"

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
sysinfo = { version = "=0.37.2", default-features = false, features = ["system"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.30", features = ["fs", "user"] }

[lints.rust]
unsafe_code = "forbid"
